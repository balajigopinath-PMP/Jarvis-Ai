<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <base href="." />
    <title>Jarvis | LaMini POC</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        html, body { 
            height: 100%; width: 100%; margin: 0; padding: 0;
            background-color: #000; color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden; position: fixed;
        }
        #root { height: 100svh; display: flex; flex-direction: column; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-panel { background: rgba(12, 12, 14, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes pulse-logo {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.5)); }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .logo-anim { animation: pulse-logo 3s infinite ease-in-out; }
        .dot { animation: jump 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
        window.transformers = { pipeline, env };
        env.allowLocalModels = false;
        env.useBrowserCache = true;
        env.allowRemoteModels = true;
    </script>

    <script type="text/babel">
        const MODEL_ID = "Xenova/LaMini-GPT-124M";

        const Logo = ({ size = "normal" }) => {
            const dim = size === "large" ? "w-16 h-16" : "w-10 h-10";
            return (
                <div className={`relative ${dim} flex items-center justify-center logo-anim mx-auto`}>
                    <div className="absolute inset-0 bg-purple-600 blur-xl opacity-20 rounded-full"></div>
                    <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-white">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
            );
        };

        const BootScreen = ({ status, progress, error, onEnter }) => {
            const isReady = status === "Online";
            return (
                <div className="flex-1 flex flex-col items-center justify-between p-8 bg-black">
                    <div className="flex-1 flex flex-col items-center justify-center space-y-6 w-full">
                        <Logo size="large" />
                        <div className="text-center">
                            <h1 className="text-2xl font-bold tracking-tighter">LaMini POC</h1>
                            <p className="text-[10px] font-mono text-purple-400 tracking-widest uppercase mt-1">124M Engine • WebGPU</p>
                        </div>
                        <div className="w-full max-w-[260px] space-y-3">
                            {!error ? (
                                <>
                                    <div className="flex justify-between text-[10px] font-mono text-zinc-500">
                                        <span className="truncate max-w-[150px] uppercase">{status}</span>
                                        <span>{Math.round(progress)}%</span>
                                    </div>
                                    <div className="h-1 w-full bg-zinc-900 rounded-full overflow-hidden">
                                        <div className="h-full bg-purple-500 transition-all duration-300" style={{ width: `${isReady ? 100 : progress}%` }}></div>
                                    </div>
                                </>
                            ) : (
                                <div className="p-3 border border-red-500/30 bg-red-500/10 rounded-xl text-center">
                                    <p className="text-red-400 text-[10px] font-mono uppercase font-bold">Error</p>
                                    <p className="text-zinc-500 text-[9px] font-mono mt-1 leading-tight">{error}</p>
                                </div>
                            )}
                        </div>
                    </div>
                    <button 
                        disabled={!isReady} 
                        onClick={onEnter}
                        className={`w-full max-w-xs py-4 rounded-2xl font-bold transition-all ${isReady ? 'bg-white text-black active:scale-95 shadow-xl' : 'bg-zinc-900 text-zinc-700'}`}
                    >
                        {isReady ? "INITIALIZE ENGINE" : "SYNCING DATA..."}
                    </button>
                </div>
            );
        };

        const HomeScreen = ({ onNext }) => (
            <div className="flex-1 flex flex-col bg-[#08080A] overflow-y-auto no-scrollbar pb-10">
                <div className="p-6 text-center pt-12">
                    <Logo />
                    <h2 className="text-2xl font-semibold mt-4">Edge AI Session</h2>
                    <div className="mt-4 p-4 rounded-2xl bg-purple-900/10 border border-purple-500/20 max-w-xs mx-auto">
                        <p className="text-xs text-purple-200 leading-relaxed font-medium">
                            <i className="ph ph-wifi-slash mr-2"></i>
                            This is a fully local POC. Once the model is loaded, you can <b>turn off your internet</b> to verify the engine runs entirely on your device.
                        </p>
                    </div>
                </div>

                <div className="px-6 space-y-6">
                    <div>
                        <p className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-3">Try these prompts (English)</p>
                        <div className="grid gap-2">
                            {[
                                "Summarize: The sun is a star at the center of the Solar System.",
                                "Tell me a very short joke about a robot.",
                                "Classify sentiment: 'This app is actually quite fast!'",
                                "What is 25 + 75?"
                            ].map(prompt => (
                                <div key={prompt} className="glass p-3 rounded-xl text-xs text-zinc-300 border-l-2 border-purple-500/50">
                                    "{prompt}"
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="p-4 rounded-2xl bg-zinc-900/50 border border-white/5">
                        <h4 className="text-[10px] font-bold text-zinc-400 uppercase mb-2">Model Constraints</h4>
                        <ul className="text-[11px] text-zinc-500 space-y-1.5 list-disc pl-4">
                            <li>124M Parameters (Tiny but fast)</li>
                            <li>Best for simple instructions</li>
                            <li>Short context window (limited history)</li>
                        </ul>
                    </div>
                </div>

                <div className="mt-auto p-6 pt-10">
                    <button 
                        onClick={onNext}
                        className="w-full py-4 bg-purple-600 rounded-2xl font-bold text-white shadow-lg active:scale-95 transition-transform"
                    >
                        START CHAT
                    </button>
                </div>
            </div>
        );

        const ChatScreen = ({ pipe }) => {
            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isThinking, setIsThinking] = React.useState(false);
            const scrollRef = React.useRef(null);

            React.useEffect(() => {
                scrollRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, isThinking]);

            const handleSend = async () => {
                if (!input.trim() || isThinking) return;
                const text = input.trim();
                setMessages(p => [...p, { role: "user", content: text }]);
                setInput("");
                setIsThinking(true);

                try {
                    const prompt = `### Instruction:\n${text}\n\n### Response:`;
                    const res = await pipe(prompt, { 
                        max_new_tokens: 64, 
                        temperature: 0.5, 
                        do_sample: true,
                        repetition_penalty: 1.2
                    });
                    const reply = res[0].generated_text.split("### Response:")[1]?.trim() || "Engine could not generate a response.";
                    setMessages(p => [...p, { role: "assistant", content: reply }]);
                } catch (e) {
                    setMessages(p => [...p, { role: "assistant", content: "Local error. Ensure WebGPU is active." }]);
                } finally {
                    setIsThinking(false);
                }
            };

            return (
                <div className="flex-1 flex flex-col bg-black overflow-hidden relative">
                    <div className="p-4 border-b border-white/5 flex items-center justify-between bg-black/80 backdrop-blur-xl z-10">
                        <div className="flex items-center gap-2">
                            <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span className="text-[10px] font-mono text-zinc-400 uppercase tracking-widest">OFFLINE CORE READY</span>
                        </div>
                        <button onClick={() => window.location.reload()} className="text-zinc-600 hover:text-white transition-colors">
                            <i className="ph ph-arrow-counter-clockwise font-bold"></i>
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar pb-28">
                        {messages.length === 0 && (
                            <div className="h-full flex flex-col items-center justify-center opacity-30 text-center px-10 pt-20">
                                <i className="ph ph-lightning text-4xl mb-3 text-purple-500"></i>
                                <p className="text-[10px] font-mono uppercase tracking-widest">Awaiting local neural inference</p>
                            </div>
                        )}
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[88%] p-3.5 text-sm rounded-2xl leading-relaxed ${m.role === 'user' ? 'bg-white text-black rounded-tr-none font-medium' : 'glass-panel text-zinc-200 rounded-tl-none'}`}>
                                    {m.content}
                                </div>
                            </div>
                        ))}
                        {isThinking && (
                            <div className="flex gap-1.5 p-3.5 glass-panel rounded-2xl w-fit">
                                <div className="w-1.5 h-1.5 bg-purple-500 rounded-full dot"></div>
                                <div className="w-1.5 h-1.5 bg-purple-500 rounded-full dot"></div>
                                <div className="w-1.5 h-1.5 bg-purple-500 rounded-full dot"></div>
                            </div>
                        )}
                        <div ref={scrollRef} />
                    </div>

                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black via-black to-transparent pointer-events-none">
                        <div className="max-w-xl mx-auto glass-panel rounded-2xl flex items-center gap-2 p-1 pl-4 pr-1 pointer-events-auto shadow-2xl">
                            <input 
                                className="flex-1 bg-transparent border-none outline-none text-sm py-3 text-white placeholder-zinc-700"
                                placeholder="Message local engine..."
                                value={input}
                                onChange={e => setInput(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleSend()}
                            />
                            <button 
                                onClick={handleSend}
                                className="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white active:scale-90 transition-transform shadow-lg shadow-purple-900/40"
                            >
                                <i className="ph ph-arrow-up font-bold"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [screen, setScreen] = React.useState('boot');
            const [pipe, setPipe] = React.useState(null);
            const [status, setStatus] = React.useState("Detecting GPU...");
            const [progress, setProgress] = React.useState(0);
            const [error, setError] = React.useState(null);

            React.useEffect(() => {
                const init = async () => {
                    let attempts = 0;
                    while (!window.transformers && attempts < 100) {
                        await new Promise(r => setTimeout(r, 100));
                        attempts++;
                    }
                    if (!window.transformers) return setError("Transformers library failed to load.");

                    try {
                        const { pipeline } = window.transformers;
                        const instance = await pipeline('text-generation', MODEL_ID, {
                            device: 'webgpu',
                            progress_callback: (d) => {
                                if (d.status === 'progress') setProgress(d.progress);
                                if (d.file) setStatus(`Downloading: ${d.file.slice(-12)}`);
                                if (d.status === 'ready') setStatus("Model Ready");
                            }
                        });
                        setPipe(() => instance);
                        setStatus("Online");
                        setProgress(100);
                    } catch (e) {
                        setError("Incompatible Hardware: This POC requires a browser with WebGPU support (Chrome/Edge/Arc).");
                    }
                };
                init();
            }, []);

            return (
                <div className="flex-1 flex flex-col h-full w-full">
                    {screen === 'boot' && <BootScreen status={status} progress={progress} error={error} onEnter={() => setScreen('home')} />}
                    {screen === 'home' && <HomeScreen onNext={() => setScreen('chat')} />}
                    {screen === 'chat' && <ChatScreen pipe={pipe} />}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
