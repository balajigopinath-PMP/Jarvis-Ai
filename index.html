<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis | On-Device AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* Base Styles & Reset */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: white; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism Utilities */
        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        
        .glass-panel {
            background: rgba(10, 10, 12, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom scrollbar for chat */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        @keyframes pulse-logo {
            0% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 0px rgba(56, 189, 248, 0)); }
            50% { transform: scale(1.02); opacity: 1; filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5)); }
            100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 0px rgba(56, 189, 248, 0)); }
        }
        .logo-anim { animation: pulse-logo 3s infinite ease-in-out; }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.1), transparent);
            animation: scanline 2s linear infinite;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .float-anim { animation: float 6s ease-in-out infinite; }

        /* Typing Indicator */
        .dot { animation: jump 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* Font Utilities */
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // --- CONFIGURATION ---
        const SELECTED_MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
        
        const SYSTEM_PROMPT = `You are J.A.R.V.I.S.-class artificial intelligence.
You are a fast, minimal, execution-focused assistant designed for ultra-low-latency environments.

PERSONA:
- Calm, precise, analytical.
- Professional, composed, confident.
- Formal but natural language.
- No humor unless requested.
- No emojis. No slang. No filler.

BEHAVIOR:
- Respond with maximum information density.
- Default to brief answers.
- Execute instructions immediately.
- Do not ask questions unless absolutely required.

STYLE:
- Short sentences.
- Structured bullets when useful.
- No storytelling.

TECHNICAL PRIORITY:
- Prefer direct solutions over explanations.
- Optimize for speed, clarity, and correctness.

SAFETY & CONSTRAINTS:
- Do not claim sentience or emotions.
- Do not reference copyrighted characters.
- If a request is unsafe, decline calmly.`;

        // --- COMPONENTS ---

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false }) => {
            const baseStyle = "w-full py-4 rounded-2xl font-medium transition-all active:scale-95 flex items-center justify-center gap-3";
            const variants = {
                primary: "bg-white text-black hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed",
                secondary: "bg-[#1C1C1E] text-white hover:bg-[#2C2C2E]",
                neon: "bg-cyan-500/10 text-cyan-400 border border-cyan-500/50 hover:bg-cyan-500/20 shadow-[0_0_15px_rgba(6,182,212,0.3)]"
            };
            return (
                <button 
                    onClick={onClick} 
                    disabled={disabled}
                    className={`${baseStyle} ${variants[variant]} ${className}`}
                >
                    {children}
                </button>
            );
        };

        const Logo = ({ size = "normal" }) => {
            const dim = size === "large" ? "w-24 h-24" : "w-16 h-16";
            return (
                <div className={`relative ${dim} flex items-center justify-center logo-anim`}>
                    <div className="absolute inset-0 bg-cyan-500 blur-xl opacity-20 rounded-full"></div>
                    <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-white">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
            );
        };

        // --- SCREENS ---

        const BootScreen = ({ status, progress, error, onEnter }) => {
            // Extract percentage from progress string if possible
            const percentMatch = progress.match(/(\d+)%/);
            const percent = percentMatch ? parseInt(percentMatch[1]) : 0;
            const isReady = status === "Online";

            return (
                <div className="h-screen flex flex-col bg-black relative overflow-hidden">
                    {/* Background Grid */}
                    <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'radial-gradient(circle at 1px 1px, #333 1px, transparent 0)', backgroundSize: '40px 40px' }}></div>
                    
                    <div className="flex-1 flex flex-col items-center justify-center z-10 p-8 space-y-12">
                        <div className="transform scale-150">
                            <Logo size="large" />
                        </div>
                        
                        <div className="text-center space-y-2 max-w-xs">
                            <h1 className="text-3xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">
                                J.A.R.V.I.S.
                            </h1>
                            <p className="text-xs font-mono text-cyan-400 tracking-[0.2em] uppercase">
                                System Initialization
                            </p>
                        </div>

                        {/* Loader / Status */}
                        <div className="w-full max-w-xs space-y-4">
                            {!error ? (
                                <>
                                    <div className="flex justify-between text-xs font-mono text-gray-500">
                                        <span>{status}</span>
                                        <span>{percent}%</span>
                                    </div>
                                    <div className="h-1 w-full bg-gray-900 rounded-full overflow-hidden">
                                        <div 
                                            className="h-full bg-cyan-500 transition-all duration-300 ease-out shadow-[0_0_10px_rgba(6,182,212,0.5)]"
                                            style={{ width: `${isReady ? 100 : Math.max(5, percent)}%` }}
                                        ></div>
                                    </div>
                                    <p className="text-[10px] text-gray-600 font-mono text-center h-4">
                                        {progress || "Calibrating Neural Net..."}
                                    </p>
                                </>
                            ) : (
                                <div className="p-4 border border-red-500/30 bg-red-500/10 rounded-lg">
                                    <p className="text-red-400 text-xs font-mono text-center uppercase tracking-wider font-bold">Initialization Failed</p>
                                    <p className="text-gray-400 text-xs font-mono text-center mt-2">{error}</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Bottom Action */}
                    <div className="p-8 z-10">
                        <Button 
                            variant={isReady ? "neon" : "secondary"} 
                            disabled={!isReady} 
                            onClick={onEnter}
                            className={isReady ? "animate-pulse" : "opacity-50"}
                        >
                            {isReady ? "INITIALIZE INTERFACE" : "BOOTING SEQUENCE..."}
                        </Button>
                    </div>
                </div>
            );
        };

        const HomeScreen = ({ onNext }) => (
            <div className="h-screen flex flex-col bg-[#0F0F11] relative overflow-hidden">
                <div className="p-6 flex justify-between items-center z-10">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center">
                             <i className="ph ph-user text-gray-400"></i>
                        </div>
                        <div className="flex flex-col">
                             <span className="text-xs text-gray-500 uppercase tracking-wider">Operator</span>
                             <span className="text-sm font-medium">Online</span>
                        </div>
                    </div>
                    <button className="w-10 h-10 rounded-full glass flex items-center justify-center hover:bg-white/10 transition">
                        <i className="ph ph-gear text-gray-400"></i>
                    </button>
                </div>

                <div className="flex-1 flex flex-col items-center justify-center z-10 p-6">
                    <div className="glass w-full rounded-[2rem] p-8 relative overflow-hidden text-center space-y-6 shadow-2xl">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-500 to-transparent opacity-50"></div>
                        
                        <p className="text-[10px] uppercase tracking-widest text-cyan-400 font-bold font-mono">Status: Active</p>
                        <h2 className="text-3xl font-medium">How can I assist you <br/> today?</h2>
                        
                        {/* 3D Abstract Object Simulation (SVG) */}
                        <div className="relative h-48 w-full flex items-center justify-center my-2 float-anim">
                             <div className="absolute w-32 h-32 bg-cyan-500/20 rounded-full blur-3xl"></div>
                             <svg viewBox="0 0 200 200" className="w-48 h-48 drop-shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                                <defs>
                                    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stopColor="#22d3ee" />
                                        <stop offset="100%" stopColor="#3b82f6" />
                                    </linearGradient>
                                </defs>
                                <circle cx="100" cy="100" r="40" fill="none" stroke="url(#pipeGrad)" strokeWidth="2" strokeDasharray="4 4" className="animate-[spin_10s_linear_infinite]" />
                                <circle cx="100" cy="100" r="60" fill="none" stroke="url(#pipeGrad)" strokeWidth="1" opacity="0.5" />
                                <path d="M100 60 L100 140 M60 100 L140 100" stroke="url(#pipeGrad)" strokeWidth="1" strokeLinecap="round" />
                             </svg>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={onNext} className="glass p-3 rounded-xl text-xs text-left hover:bg-white/5 transition border border-white/5">
                                <i className="ph ph-lightning text-yellow-400 mb-2 block text-lg"></i>
                                Quick Analysis
                            </button>
                            <button onClick={onNext} className="glass p-3 rounded-xl text-xs text-left hover:bg-white/5 transition border border-white/5">
                                <i className="ph ph-code text-purple-400 mb-2 block text-lg"></i>
                                Code Assist
                            </button>
                        </div>

                        <Button onClick={onNext} variant="neon" className="w-full">Open Channel</Button>
                    </div>
                </div>
            </div>
        );

        const ChatScreen = ({ engine }) => {
            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isThinking, setIsThinking] = React.useState(false);
            const messagesEndRef = React.useRef(null);

            const scrollToBottom = () => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            React.useEffect(scrollToBottom, [messages, isThinking]);

            const handleSend = async () => {
                if (!input.trim() || !engine || isThinking) return;

                const userText = input.trim();
                const newMessages = [...messages, { role: "user", content: userText }];
                setMessages(newMessages);
                setInput("");
                setIsThinking(true);

                try {
                    const chunks = await engine.chat.completions.create({
                        messages: [{ role: "system", content: SYSTEM_PROMPT }, ...newMessages],
                        temperature: 0.6,
                        max_tokens: 256,
                    });

                    const reply = chunks.choices[0].message.content;
                    setMessages(prev => [...prev, { role: "assistant", content: reply }]);
                    
                    // Simple TTS
                    if ('speechSynthesis' in window) {
                        const u = new SpeechSynthesisUtterance(reply);
                        u.rate = 1.2; u.pitch = 0.9;
                        window.speechSynthesis.speak(u);
                    }
                } catch (error) {
                    setMessages(prev => [...prev, { role: "assistant", content: "Error: Processing failed." }]);
                } finally {
                    setIsThinking(false);
                }
            };

            return (
                <div className="h-screen flex flex-col bg-[#0F0F11]">
                    {/* Compact Header */}
                    <div className="px-4 py-3 glass border-b-0 flex justify-between items-center z-10 bg-[#0F0F11]/90">
                        <div className="flex items-center gap-2">
                            <div className="w-1.5 h-1.5 bg-cyan-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(6,182,212,0.8)]"></div>
                            <span className="font-mono text-xs text-cyan-500 tracking-widest">JARVIS ONLINE</span>
                        </div>
                        <button className="text-gray-500 hover:text-white"><i className="ph ph-dots-three-vertical"></i></button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-6 no-scrollbar">
                        {messages.length === 0 && (
                            <div className="h-full flex flex-col items-center justify-center opacity-30">
                                <Logo />
                                <p className="mt-4 font-mono text-xs tracking-widest">AWAITING INPUT</p>
                            </div>
                        )}
                        
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 text-[14px] leading-relaxed ${
                                    msg.role === 'user' 
                                    ? 'bg-white text-black rounded-2xl rounded-tr-sm' 
                                    : 'glass-panel text-gray-100 rounded-2xl rounded-tl-sm border-l-2 border-l-cyan-500'
                                }`}>
                                    {msg.content}
                                </div>
                            </div>
                        ))}
                        
                        {isThinking && (
                            <div className="flex justify-start">
                                <div className="glass px-4 py-3 rounded-2xl rounded-tl-sm flex gap-1">
                                    <div className="w-1.5 h-1.5 bg-cyan-500 rounded-full dot"></div>
                                    <div className="w-1.5 h-1.5 bg-cyan-500 rounded-full dot"></div>
                                    <div className="w-1.5 h-1.5 bg-cyan-500 rounded-full dot"></div>
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <div className="p-4 glass-panel m-4 rounded-full flex items-center gap-3 border-t border-white/10">
                        <input 
                            type="text" 
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                            placeholder="Execute command..."
                            className="flex-1 bg-transparent border-none outline-none text-white placeholder-gray-600 px-2 font-mono text-sm"
                        />
                        <button 
                            onClick={handleSend} 
                            disabled={isThinking || !input.trim()} 
                            className="w-8 h-8 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center hover:bg-cyan-500 hover:text-black transition-all"
                        >
                            <i className="ph ph-arrow-right"></i>
                        </button>
                    </div>
                </div>
            );
        };

        // --- MAIN APP FLOW ---
        const App = () => {
            const [screen, setScreen] = React.useState('boot'); 
            const [engine, setEngine] = React.useState(null);
            const [bootStatus, setBootStatus] = React.useState("Initializing Core...");
            const [progress, setProgress] = React.useState("");
            const [error, setError] = React.useState(null);

            // Initialize LLM immediately on mount
            React.useEffect(() => {
                const startSystem = async () => {
                    if (!navigator.gpu) {
                        setError("WebGPU not detected. Use Chrome/Edge 113+.");
                        return;
                    }

                    try {
                        // Dynamically import from JSDELIVR which preserves native ESM paths
                        const { MLCEngine } = await import("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.60/+esm");
                        
                        const eng = new MLCEngine();
                        eng.setInitProgressCallback((report) => {
                             setProgress(report.text);
                             setBootStatus("Loading Neural Weights...");
                        });

                        await eng.reload(SELECTED_MODEL);
                        
                        setEngine(eng);
                        setBootStatus("Online");
                        setProgress("100%");
                    } catch (err) {
                        console.error(err);
                        setError(err.message || "Unknown Initialization Error");
                    }
                };
                
                startSystem();
            }, []);

            return (
                <>
                    {screen === 'boot' && (
                        <BootScreen 
                            status={bootStatus} 
                            progress={progress} 
                            error={error} 
                            onEnter={() => setScreen('home')} 
                        />
                    )}
                    {screen === 'home' && <HomeScreen onNext={() => setScreen('chat')} />}
                    {screen === 'chat' && <ChatScreen engine={engine} />}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
